<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: 工程計算紙 — 單欄筆記，每次回答是一個 entry，最新的在最下面，上方有目錄 */
:root {
  --bg: #f2f5f1;
  --paper: #fbfcfa;
  --grid: #dfe7df;
  --ink: #1c2622;
  --muted: #5d6b64;
  --line: #c9d4cb;
  --accent: #1d6a84;
  --accent-soft: #e2eef2;
  --answer: #fff1a8;
  --answer-ink: #3d3300;
  --warn: #b4442c;
  --warn-soft: #f8e6e1;
  --font-body: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-display: "Noto Serif TC", "PMingLiU", serif;
  --font-mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111714; --paper: #161e1a; --grid: #1f2a25; --ink: #dde6e0; --muted: #94a59c;
    --line: #2e3b35; --accent: #6cc3df; --accent-soft: #17303a; --answer: #4a4110; --answer-ink: #fff3b8;
    --warn: #ef8a72; --warn-soft: #3a1f19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111714; --paper: #161e1a; --grid: #1f2a25; --ink: #dde6e0; --muted: #94a59c;
  --line: #2e3b35; --accent: #6cc3df; --accent-soft: #17303a; --answer: #4a4110; --answer-ink: #fff3b8;
  --warn: #ef8a72; --warn-soft: #3a1f19; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.75 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 20px; }
header.top h1 { font: 700 1.6rem/1.3 var(--font-display); margin: 0; text-wrap: balance; }
header.top p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
#toc { display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: .85rem; }
#toc a { color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 2px 10px; border-radius: 999px; background: var(--paper); }
#toc a:hover, #toc a:focus-visible { border-color: var(--accent); outline: none; }
#notes { display: grid; gap: 28px; }
.entry {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  border: 1px solid var(--line); border-radius: 6px;
  padding: 20px clamp(16px, 4vw, 32px) 24px;
  min-width: 0; scroll-margin-top: 16px;
}
.entry > * { max-width: 100%; }
.entry .ask { margin: 0 0 6px; color: var(--muted); font-size: .85rem; letter-spacing: .02em; }
.entry .ask::before { content: "問 · "; color: var(--accent); font-weight: 700; }
.entry h2 { font: 700 1.3rem/1.35 var(--font-display); margin: 0 0 12px; text-wrap: balance; }
.entry h3 { font-size: 1.05rem; margin: 22px 0 6px; color: var(--accent); }
.entry p, .entry li { max-width: 68ch; }
.entry code { font-family: var(--font-mono); font-size: .9em; background: var(--accent-soft); padding: 0 4px; border-radius: 3px; }
.math { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
mjx-container[display="true"] { margin: .6em 0 !important; }
.answer { background: var(--answer); color: var(--answer-ink); padding: 10px 14px; border-radius: 4px; font-weight: 500; overflow-x: auto; }
.tip, .warn { padding: 10px 14px; border-radius: 4px; font-size: .95rem; }
.tip { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.warn { background: var(--warn-soft); border-left: 3px solid var(--warn); }
.tip > :first-child, .warn > :first-child { margin-top: 0; }
.tip > :last-child, .warn > :last-child { margin-bottom: 0; }
figure.diagram { margin: 16px 0; overflow-x: auto; text-align: center; }
figure.diagram svg { max-width: 100%; height: auto; color: var(--ink); }
figure.diagram figcaption { font-size: .85rem; color: var(--muted); margin-top: 6px; }
svg .accent { stroke: var(--accent); fill: none; }
svg .fill-accent { fill: var(--accent); }
svg text { fill: currentColor; font-family: var(--font-body); }
figure.source { margin: 12px 0 16px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); overflow: hidden; }
figure.source img { display: block; width: 100%; height: auto; }
figure.source figcaption { font-size: .8rem; color: var(--muted); padding: 4px 10px; border-top: 1px solid var(--line); font-family: var(--font-mono); }
img.src-dark { display: none !important; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) img.src-light { display: none !important; }
  :root:not([data-theme="light"]) img.src-dark { display: block !important; }
}
:root[data-theme="dark"] img.src-light { display: none !important; }
:root[data-theme="dark"] img.src-dark { display: block !important; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 8px 0; background: var(--paper); }
th, td { border: 1px solid var(--line); padding: 4px 12px; text-align: left; }
th { background: var(--accent-soft); font-weight: 500; }
ol.steps { padding-left: 1.4em; }
ol.steps > li { margin-bottom: 6px; }
/* 有題目區塊（.prob）的 entry 在寬螢幕改左右兩欄：題目固定在左，解法在右往下捲；其他 entry 與窄螢幕維持單欄 */
@media (min-width: 1100px) {
  .wrap:has(.entry > .prob) { max-width: 1280px; }
  .entry:has(> .prob) { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); column-gap: 28px; align-items: start; }
  .entry:has(> .prob) > * { grid-column: 2; }
  .entry > .prob { grid-column: 1; grid-row: 1 / span 999; position: sticky; top: 12px; }
  .entry > .prob figure.source { margin-top: 0; }
  .entry > .prob + * { margin-top: 0; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>__TITLE__</h1>
    <p>__SUBTITLE__</p>
  </header>
  <nav id="toc" aria-label="目錄"></nav>
  <main id="notes">
<!-- NEXT -->
  </main>
</div>

<script>
window.MathJax = {
  tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] },
  svg: { fontCache: "global" }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script>
(function () {
  var entries = document.querySelectorAll("#notes > .entry");
  var toc = document.getElementById("toc");
  entries.forEach(function (sec, i) {
    if (!sec.id) sec.id = "n" + (i + 1);
    var h = sec.querySelector("h2");
    var a = document.createElement("a");
    a.href = "#" + sec.id;
    a.textContent = (i + 1) + ". " + (h ? h.textContent : "第 " + (i + 1) + " 則");
    toc.appendChild(a);
  });
  toc.hidden = entries.length < 2;
  // 題目左欄：把 sticky 的 top 設成它一開始的位置，從第一下捲動就固定不動
  function pinProbs() {
    if (window.scrollY > 0) return;
    var wrap = document.querySelector(".wrap");
    var z = parseFloat(getComputedStyle(wrap).zoom) || 1;
    document.querySelectorAll(".entry > .prob").forEach(function (p) {
      p.style.top = "";
      if (getComputedStyle(p).position !== "sticky") return;
      var t = p.getBoundingClientRect().top;
      if (t > 0 && t < window.innerHeight * 0.5) p.style.top = (t / z) + "px";
    });
  }
  pinProbs();
  window.addEventListener("load", pinProbs);
  window.addEventListener("resize", pinProbs);
  if (!location.hash && entries.length > 1) {
    entries[entries.length - 1].scrollIntoView({ block: "start" });
  }
})();
</script>
